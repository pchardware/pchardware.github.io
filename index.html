<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Hardware</title>
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#222222">
<link rel="apple-touch-icon" href="images/icons/app-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PC Hardware">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PC Hardware">
<meta property="og:title" content="PC Hardware">
<meta property="og:description" content="Transporte disponible y flexibilidad en la forma de pago.">
<meta name="description" content="Transporte disponible y flexibilidad en la forma de pago.">
<meta property="og:url" content="https://pchardware.github.io/">
<link rel="icon" type="image/png" href="images/icons/fav.png">
<style>
:root{--acc:#b42318;--bg:rgb(34,34,34);--on:#fff;--ink:#14171c;--mut:#667085;--line:#e4e7ec;--page:#f4f5f7;--soft:#f1f3f6;--ok:#12715b;--okbg:#e3f3ec;--hot:#b42318;--hotbg:#fde9e7;--wa:#128c4a;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body>main{flex:1 0 auto;width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
#note{background:var(--bg);color:var(--on);font-size:12px;text-align:center;padding:6px 0;box-shadow:inset 0 0 0 99px rgba(0,0,0,.22)}
header{background:var(--bg);color:var(--on);position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(16,24,40,.10)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:0 14px;min-height:56px}
.brand{flex:1;font-size:18px;letter-spacing:.09em;font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font-weight:800}
.brand svg{width:18px;height:18px;margin-left:8px;vertical-align:-3px}
#note.se{box-shadow:none}
#note svg{width:15px;height:15px;margin-right:6px;vertical-align:-3px}
.search{position:relative;order:3;flex:1 0 100%;min-width:0;padding-bottom:10px;display:flex;gap:8px}
.search>svg{position:absolute;left:11px;top:10px;width:18px;height:18px;opacity:.75;pointer-events:none}
.search input{flex:1 1 0;width:0;min-width:0;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:0 12px 0 36px;background:rgba(255,255,255,.12);color:inherit;outline:0;-webkit-appearance:none}
.search input::placeholder{color:inherit;opacity:.65}
.search input:focus{background:#fff;color:var(--ink);border-color:#fff}
.search:focus-within>svg{color:var(--ink)}
#inst{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;background:var(--on);color:var(--bg);font-size:14px;font-weight:700;white-space:nowrap}
#inst svg{width:17px;height:17px;stroke-width:2.2}
@media(min-width:720px){.brand{flex:none}.search{order:0;flex:1;max-width:520px;margin:0 auto;padding:0}}
.ic{position:relative;margin-left:auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.ic[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:1px;right:-2px;background:#d92d20;color:#fff;font-size:11px;font-weight:600;line-height:17px;min-width:17px;border-radius:9px;text-align:center;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;color:#344054;background:#fff;white-space:nowrap}
.chip.on{background:var(--bg);border-color:var(--bg);color:var(--on)}
#cats{gap:22px;padding:2px 0 0;border-bottom:1px solid var(--line)}
#cats .chip{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:13px 1px 11px;font-size:15px;font-weight:600;color:var(--mut)}
#cats .chip.on{color:var(--ink);border-bottom-color:var(--ink)}
#kws{padding-top:8px}
#kws .chip{border:0;background:#e9ecf0;border-radius:6px;padding:4px 9px;font-size:12.5px;color:#475467}
#kws .chip.on{background:var(--ink);color:#fff}
.tools{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.tools select{margin-left:auto;border:1px solid var(--line);border-radius:10px;height:36px;padding:0 10px;background:#fff;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:28px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:16px}}
.card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:box-shadow .15s,transform .15s}
@media(hover:hover){.card:hover{box-shadow:0 8px 24px rgba(16,24,40,.10);transform:translateY(-2px)}}
.pic{position:relative;display:block;aspect-ratio:4/3;background:#fff;padding:6px}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
img.bad{opacity:0}
.b1,.b2{position:absolute;top:8px;font-size:10.5px;font-weight:600;line-height:18px;padding:0 7px;letter-spacing:.03em;text-transform:uppercase;border-radius:999px}
.b1{left:8px;background:var(--okbg);color:var(--ok)}
.b2{right:8px;background:var(--hotbg);color:var(--hot)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;border-top:1px solid var(--soft)}
.name{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat{color:var(--mut);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.add{width:36px;height:36px;border:1px solid #d0d5dd;border-radius:50%;color:#475467;display:flex;align-items:center;justify-content:center}
.add svg{width:19px;height:19px}
.add.on{background:var(--bg);border-color:var(--bg);color:var(--on)}
.sk{aspect-ratio:3/4;border:0;background:linear-gradient(100deg,#e9ecf0 40%,#f6f7f9 50%,#e9ecf0 60%) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.card{transition:none}}
.msg{padding:56px 12px;text-align:center;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--bg);background:var(--bg);color:var(--on);font-weight:600;font-size:15px;white-space:nowrap}
.btn.alt{background:#fff;color:var(--ink);border-color:#d0d5dd}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wao{background:#fff;color:var(--wa);border-color:var(--wa)}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.crumb{padding:14px 0;font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{color:#344054}
.crumb a:hover{text-decoration:underline}
.pv{display:grid;gap:14px}
@media(min-width:820px){.pv{grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}}
.gal{position:relative;aspect-ratio:4/3;background:#fff center/contain no-repeat;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:contain;display:block}
.gal button{position:absolute;top:50%;margin-top:-21px;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(16,24,40,.12);display:flex;align-items:center;justify-content:center}
.gal .pr{left:10px}.gal .nx{right:10px}
.gal .cnt{position:absolute;bottom:10px;right:12px;background:rgba(20,23,28,.7);color:#fff;font-size:12px;padding:2px 9px;border-radius:999px}
.pv h1{font-size:22px;line-height:1.25;letter-spacing:-.01em;margin:0 0 8px}
.tags{display:flex;gap:6px;margin-bottom:10px;min-height:0}
.tags span{position:static}
.pv .price{font-size:30px}
.cur{font-size:.55em;font-weight:600;color:var(--mut);margin-left:4px;letter-spacing:.03em}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.specs span{background:var(--soft);border-radius:6px;padding:3px 8px;font-size:12.5px;color:#344054}
.qty{display:inline-flex;align-items:center;border:1px solid #d0d5dd;border-radius:10px;height:46px;background:#fff}
.qty button{width:40px;height:44px;font-size:20px;color:#475467}
.qty input{width:40px;border:0;text-align:center;outline:0;background:none;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.acts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.acts .two{grid-column:1/-1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.acts.col{grid-template-columns:1fr;margin-top:14px}
.trust{margin-top:14px;padding:2px 16px}
.trust div{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--soft);font-size:13.5px;color:#475467}
.trust div:first-child{border-top:0}
.trust svg{color:var(--ok);margin-top:1px}
.trust b,.fcols b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.trust span{white-space:pre-line}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.dbox{margin-top:14px}
.desc{white-space:pre-line;color:#344054;margin:0}
h2{font-size:17px;letter-spacing:-.01em;margin:26px 0 12px}
.rel{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.rel .card{flex:none;width:172px}
.cartbox{max-width:760px;margin:0 auto}
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:6px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--soft)}
.ci:first-child{border-top:0;padding-top:0}
.ci img{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;grid-row:span 2}
.ci .x{color:#98a2b3;width:36px;height:36px;display:flex;align-items:center;justify-content:center;justify-self:end}
.ci .qty{height:36px}.ci .qty button{height:34px;width:34px}
.ci .lt{font-weight:700;justify-self:end;font-variant-numeric:tabular-nums}
.ci small{color:var(--mut);margin-left:6px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:16px 0 0;border-top:1px solid var(--line);margin-top:4px;font-variant-numeric:tabular-nums}
footer{background:var(--bg);color:var(--on);margin-top:32px;padding:28px 0 88px;font-size:13.5px}
.fcols{display:grid;gap:16px;margin-bottom:22px}
@media(min-width:720px){.fcols{grid-template-columns:repeat(3,1fr);gap:28px}}
.fcols div{display:flex;gap:12px}
.fcols b{color:inherit}
.fcols span span{opacity:.75}
.fline{border-top:1px solid rgba(128,128,128,.35);padding-top:16px}
footer p{margin:0 0 6px;opacity:.7}
#wa{position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(16,24,40,.28);z-index:6}
#wa svg{width:27px;height:27px}
#top{position:fixed;right:20px;bottom:78px;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);color:#344054;box-shadow:0 4px 12px rgba(16,24,40,.14);display:flex;align-items:center;justify-content:center;z-index:6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(20,23,28,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:80%;text-align:center}
#zoom{position:fixed;inset:0;background:#fff;z-index:10;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#zoom img{max-width:100%;height:auto}
.btn:disabled{opacity:.45;cursor:default}
#cats .chip.bt{color:var(--acc)}
#cats .chip.bt.on{border-bottom-color:var(--acc)}
.bt svg{width:19px;height:19px;stroke-width:2;margin-right:6px;vertical-align:-4px}
.bpromo{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
.bpromo svg{width:26px;height:26px;color:#475467}
.bpromo svg:last-child{width:20px;height:20px;color:#98a2b3}
.bpromo.big{padding:18px 18px;background:var(--bg);color:var(--on);border-color:var(--bg)}
.bpromo.big svg,.bpromo.big svg:last-child{color:inherit}
.bpromo.big span span{color:inherit;opacity:.8}
.bpromo.big b{font-size:17px}
.bpromo>span{flex:1;min-width:0}
.bpromo b{display:block;font-size:15px}
.bpromo span span{display:block;color:var(--mut);font-size:13px}
.bint{color:var(--mut);margin:-6px 0 14px}
.uses{display:grid;gap:8px;margin-bottom:18px}
@media(min-width:560px){.uses{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.use{text-align:left;border:1px solid #d0d5dd;border-radius:10px;padding:11px 13px;background:#fff}
.use b{display:block;font-size:15px}
.use span{display:block;color:var(--mut);font-size:13px;line-height:1.35}
.use.on{border-color:var(--bg);box-shadow:inset 0 0 0 1px var(--bg);background:var(--soft)}
.bud{display:flex;align-items:center;justify-content:center;gap:18px}
.bud button{width:42px;height:42px;border:1px solid #d0d5dd;border-radius:50%;font-size:22px;line-height:1;color:#475467;background:#fff}
.bud button:disabled{opacity:.35}
.bud .price{font-size:28px;min-width:124px;text-align:center}
#bRange{display:block;width:100%;margin:14px 0 4px;accent-color:var(--bg)}
.bends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.bsec{margin:22px 2px 8px}
.br{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--soft);width:100%;text-align:left}
.br:first-child{border-top:0;padding-top:0}
.br:last-child{padding-bottom:0}
.br img,.br .ph{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.br .ph{display:flex;align-items:center;justify-content:center;color:#98a2b3;border-style:dashed}
.br .name,.br .feat{display:-webkit-box}
.bl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bl i{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;margin-left:7px;color:var(--hot)}
.bl i.op{color:#98a2b3}
.bw{display:block;color:var(--hot);font-size:12.5px;line-height:1.35}
.bside{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bside .lt{font-weight:700;font-variant-numeric:tabular-nums}
.bchg{border:1px solid #d0d5dd;border-radius:8px;padding:5px 11px;font-size:13px;color:#344054;background:#fff;white-space:nowrap}
.bchg.go{background:var(--bg);border-color:var(--bg);color:var(--on)}
.bd{font-size:12.5px;color:var(--mut);white-space:nowrap}
.bd.on{color:var(--ok);font-weight:600}
.bd svg{width:15px;height:15px;margin-right:3px;vertical-align:-3px}
.bst{display:flex;gap:8px;align-items:flex-start;margin:12px 2px;font-size:13.5px;color:var(--ok)}
.bst.bad{color:var(--hot)}
.bst svg{width:18px;height:18px;margin-top:1px}
.btot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.binc{margin-top:14px}
.binc summary{cursor:pointer;color:var(--mut);font-size:13.5px;padding:6px 2px 10px}
#home{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:14px 0 6px}
#home>*{min-width:0}
#home h2{margin:0 0 10px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hrow .card{flex:none;width:172px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.tile span{font-size:13.5px;padding:7px 10px 9px}}
.tile{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile img{width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#fff;padding:6px;display:block}
.tile span{padding:6px 8px 8px;font-size:12.5px;font-weight:600;line-height:1.25;border-top:1px solid var(--soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:calc(2.5em + 14px);box-sizing:border-box}
.hcat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 8px}
.hcat:first-child{margin-top:0}
.htrust{padding:2px 16px}
@media(min-width:720px){.htrust{display:grid;grid-template-columns:repeat(3,1fr);gap:0 24px}.htrust div{border-top:0!important}}
#allh{margin:18px 0 4px}
#zoom button{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:rgba(20,23,28,.7);color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="note" hidden><div class="wrap"></div></div>
<header>
 <div class="wrap">
  <div class="bar">
   <a class="brand" data-nav href="./" id="brand"></a>
   <div class="search" id="searchBox"><input id="q" type="search" placeholder="Buscar en el catálogo" autocomplete="off" enterkeyhint="search"><button id="inst" hidden></button></div>
   <button class="ic" id="cartBtn" data-n="0" aria-label="Cesta"></button>
  </div>
 </div>
</header>
<main class="wrap">
 <div class="chips" id="cats"></div>
 <section id="vList">
  <div id="home" hidden></div>
  <div class="chips sm" id="subs"></div>
  <div class="chips sm kw" id="kws"></div>
  <h2 id="allh" hidden>Todos los artículos</h2>
  <div class="tools">
   <select id="sort" aria-label="Ordenar por"><option value="new">Recientes</option><option value="asc">Más económicos</option><option value="desc">Más costosos</option></select></div>
  <div class="grid" id="grid"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div>
  <div class="msg" id="state" hidden></div>
 </section>
 <section id="vProd" hidden></section>
 <section id="vCart" hidden></section>
 <section id="vBuild" hidden></section>
</main>
<footer id="contacto"><div class="wrap">
 <div class="fcols" id="fCols"></div><div class="fline"><p id="fFoot"></p><p id="fCopy"></p></div>
</div></footer>
<button id="top" hidden aria-label="Subir"></button>
<button id="wa" hidden aria-label="WhatsApp"></button>
<div id="toast" hidden></div>
<div id="zoom" hidden><img alt=""><button aria-label="Cerrar"></button></div>
<script>
(function(){
"use strict";
var IC={
 cart:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12h11L21 7H6.2"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12h11l1.2-4M15 3v6M12 6h6"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12h11l1.2-4M12 6l2.5 2.5L19 4"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 l:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 r:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',

function bFix(si){var q=bBad(PC.p[si],si),lock={},done=[],g=0;lock[si]=1;
 while(q.length&&g++<20){var j=q.shift();if(lock[j])continue;
  var old=bySlug[PC.p[j]].Price,best=null,bd=1e9,loose=null,ld=1e9;

   var dd=Math.abs(bySlug[k].Price-old);if(all&&dd<bd){bd=dd;best=k}if(lk&&dd<ld){ld=dd;loose=k}});
  var k=best||loose;if(!k)continue;PC.p[j]=k;lock[j]=1;done.push(j);
  if(!best)bBad(k,j).forEach(function(o){if(!lock[o]&&q.indexOf(o)<0)q.push(o)})}
 return done}

  .sort(function(a,b){return a.p.Price-b.p.Price});

   (x.bad.length?'<span class="bw">Cambia también: '+esc(x.bad.map(function(j){return BD.slots[j].n}).join(", "))+"</span>":"")+"</span>"+
   '<span class="bside"><span class="lt">'+money(x.p.Price)+"</span>"+(x.k==cur?'<span class="bd on">'+IC.chk+"Elegido</span>":cur?'<span class="bd">'+(d>0?"+ "+money(d):d<0?"− "+money(-d):"mismo precio")+"</span>":"")+"</span></button>"}

  (no.length?'<details class="binc"><summary>'+no.length+" más, que obligan a cambiar otros componentes</summary><div class=\"box\">"+no.map(row).join("")+"</div></details>":"")+
  (cur&&!s.req&&!need?'<div class="acts col"><button class="btn alt" data-bp="">Quitar</button></div>':"")+"</div>"}

 return t+"\nTotal: $"+tot+" USD\n¿Me la pueden revisar?"}

 if(t.id=="inst"){
  if(dip){dip.prompt();dip.userChoice.then(function(){dip=null;$("inst").hidden=true},function(){})}

 if(t.id=="wa"||d.wa!=null){window.open(waUrl(waMsg),"_blank");return}

 if(d.sub!=null){F.subcategory=F.subcategory==d.sub?"":d.sub;F.feature="";go(qs(),true);return}
 if(d.kw!=null){F.feature=F.feature==d.kw?"":d.kw;go(qs(),true);return}
 if(d.add!=null){s=d.add;var on=inCart(s),p=bySlug[s];setQty(s,on?0:1);t.classList.toggle("on",!on);t.innerHTML=on?IC.plus:IC.ok;
  toast(on?"Quitado de la cesta":"Añadido a la cesta");return}

 if(t.id=="pShare"&&gal){var sp=bySlug[gal.slug],su=new URL(pUrl(gal.slug),ROOT).href;
  if(navigator.share)navigator.share({title:sp?sp.Label:"",url:su}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(su).then(function(){toast("Enlace copiado")},function(){});return}
 if(d.cq!=null){var c=getCart().items.filter(function(i){return i.productId===d.s})[0];setQty(d.s,Math.min(99,(c?parseInt(c.qty,10)||0:0)+ +d.cq));cartView();return}
 if(d.rm!=null){setQty(d.rm,0);cartView();return}

  if(d.bu==FREE){if(PC.u!=FREE){PC.u=FREE;PC.n=0;bFx={};pcSave();bView()}return}
  if(d.bu!=null){var nu=BD.uses.filter(function(x){return x.k==d.bu})[0];if(nu&&nu!==bu){PCold=null;bFx={};bApply(nu,Math.floor((bBuilds(nu).length-1)/3));bView()}return}
  if(d.bn!=null){if(bu){bFx={};bApply(bu,(PC.n||0)+ +d.bn);bPaint()}return}
  if(d.bs!=null){bY=window.scrollY;history.pushState({b:1},"",new URL(bHome()+"&c="+d.bs,ROOT).href);route();return}
  if(d.bp!=null){var si=new URLSearchParams(location.search).get("c");if(si==null)return;

/* instalable: el botón aparece solo cuando el navegador permite instalar DIRECTO (un toque y confirmar). Donde no se puede
   (iPhone, o si ya está instalada) no se muestra: nada de mandar al visitante a buscar menús (Leo 17/nov/2026). */
var touched=false;["pointerdown","keydown","touchstart"].forEach(function(n){window.addEventListener(n,function(){touched=true},{passive:true,once:true})});
/* un solo botón en la cabecera: «Instalar app» cuando el navegador permite instalar directo, o «Abrir app» cuando ya está
   instalada y se entró por el navegador (solo Android: es donde el navegador lo dice, `getInstalledRelatedApps`, y donde un
   enlace intent:// puede pasar a la app; en computadora Chrome ya ofrece «Abrir en aplicación» en su barra). */
var dip=null,hasIt=false,demo=new URLSearchParams(location.search).get("demo");
function instBtn(){var b=$("inst"),on=dip||hasIt;b.hidden=!on;if(on)b.innerHTML=dip?IC.down+"Instalar app":IC.up.replace("M5 15l7-7 7 7","M7 17L17 7M9 7h8v8")+"Abrir app"}
var standalone=!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
if(!standalone&&/android/i.test(navigator.userAgent)&&navigator.getInstalledRelatedApps)
 navigator.getInstalledRelatedApps().then(function(a){if(!dip&&!demo){hasIt=a.length>0;instBtn()}},function(){});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();if(demo)return;dip=e;hasIt=false;instBtn()});
window.addEventListener("appinstalled",function(){dip=null;hasIt=false;instBtn()});
/* ?demo=app / ?demo=instalar: ensenan los dos estados del botón aunque el equipo no los permita (revisión en vista previa) */
if(demo=="app"){hasIt=true;instBtn()}else if(demo=="instalar"){dip={prompt:function(){},userChoice:{then:function(){}}};instBtn()}
$("cartBtn").innerHTML=IC.cart;$("top").innerHTML=IC.up;$("wa").innerHTML=IC.wa;$("zoom").lastChild.innerHTML=IC.x;

/* ── guardado en el teléfono: abre al instante y sin conexión; se refresca solo si cambió ── */
if("serviceWorker" in navigator&&location.protocol!="file:"){
 navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(reg){
  if(reg.active)reg.active.postMessage({t:"prime",urls:["./","data/manifest.json","data/products-index.json"].map(function(u){return new URL(u,ROOT).href})})}).catch(function(){});
 navigator.serviceWorker.addEventListener("message",function(e){var d=e.data||{};if(d.t!="upd")return;
  if(/\/data\/(manifest|products-index)\.json$/.test(d.url))load(true);
  else if(/\/data\/builder\.json$/.test(d.url)){if(BL){BT=0;bLoad()}}
  else if(d.url==ROOT&&!touched){var k=0;try{k=+sessionStorage.getItem("rl")||0}catch(x){}
   if(Date.now()-k>60000){try{sessionStorage.setItem("rl",Date.now())}catch(x){}location.reload()}}})}
load();
})();
